<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Directory</title>
    <link rel="icon" type="image/png" href="https://github.com/Teru-dot-png/Grainmark-Directory/blob/master/Grainmark%20Logo.png?raw=true">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator/qrcode.js"></script>
    <link href="https://fonts.googleapis.com/css?family=Tahoma" rel="stylesheet">
    <style>
        body { 
            font-family: 'Tahoma', sans-serif;
            background-color: #d4d0c8;
            color: #000;
            font-size: 11px;
        }
        .window {
            background-color: #d4d0c8;
            border: 2px solid #0a246a;
        }
        .title-bar {
            background: linear-gradient(to right, #0a246a, #a6caf0);
            color: white;
            padding: 3px 5px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-xp {
            background-color: #d4d0c8;
            border: 1px solid #000;
            border-right-color: #404040;
            border-bottom-color: #404040;
            border-left-color: #fff;
            border-top-color: #fff;
            box-shadow: inset 1px 1px 0 #fff, inset -1px -1px 0 #808080;
            padding: 4px 12px;
            text-align: center;
        }
        .btn-xp:active {
            border: 1px solid #404040;
            border-right-color: #fff;
            border-bottom-color: #fff;
            border-left-color: #404040;
            border-top-color: #404040;
            box-shadow: none;
        }
        .input-xp, .select-xp {
            background-color: #fff;
            border: 1px solid #808080;
            border-right-color: #fff;
            border-bottom-color: #fff;
            border-left-color: #808080;
            border-top-color: #808080;
            padding: 3px;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
        .panel-xp {
            border: 1px solid #808080;
            border-right-color: #fff;
            border-bottom-color: #fff;
            border-left-color: #808080;
            border-top-color: #808080;
            padding: 10px;
        }
        #image-url-group { display: none; }
        #qrcode-container img { margin: auto; border: 1px solid #000; }
        .modal-backdrop, .drawer-backdrop { display: none; position: fixed; z-index: 40; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.3); }
        .notification { position: fixed; bottom: 10px; right: 10px; z-index: 50; }
        .drawer {
            position: fixed; top: 0; bottom: 0; width: 300px;
            transform: translateX(-100%); transition: transform 0.3s ease-in-out; z-index: 45;
        }
        .drawer.open { transform: translateX(0); }
        #context-menu {
            display: none; position: absolute; z-index: 100; background-color: #d4d0c8;
            border: 1px solid #808080; box-shadow: 2px 2px 2px rgba(0,0,0,0.3); padding: 2px;
        }
        .context-menu-item { padding: 2px 20px; cursor: pointer; }
        .context-menu-item:hover { background-color: #0a246a; color: #fff; }
    </style>
</head>
<body class="flex flex-col h-screen p-1">

    <div id="notification-area" class="space-y-2"></div>

    <!-- Context Menu -->
    <div id="context-menu">
        <div id="context-edit" class="context-menu-item">Edit</div>
        <div id="context-delete" class="context-menu-item">Delete</div>
        <hr class="border-t-gray-400 my-1">
        <div id="context-copy-pn" class="context-menu-item">Copy Permit Number</div>
        <div id="context-flag" class="context-menu-item">Flag for Review</div>
        <div id="context-relink" class="context-menu-item">Generate GitHub Link</div>
    </div>

    <!-- Drawers & Modals -->
    <div id="drawer-backdrop"></div>
    <div id="stats-drawer" class="drawer window left-0"><div class="title-bar"><span>Statistics</span><button id="close-stats-btn" class="btn-xp px-2 py-0 text-xs">X</button></div><div id="stats-content" class="p-4 space-y-4"></div></div>
    <div id="help-drawer" class="drawer window left-0"><div class="title-bar"><span>Keyboard Shortcuts</span><button id="close-help-btn" class="btn-xp px-2 py-0 text-xs">X</button></div><div id="help-content" class="p-4 space-y-2"></div></div>
    <div id="tools-modal" class="modal-backdrop"><div class="window absolute w-full max-w-lg"><div class="title-bar"><span>Tools</span><button id="close-tools-btn" class="btn-xp px-2 py-0 text-xs">X</button></div><div id="tools-content" class="p-4 space-y-4"></div></div></div>

    <!-- Main Application Window -->
    <div class="window flex-grow flex flex-col min-h-0">
        <div class="title-bar">Grainmark Business Directory</div>
        <div class="p-2 bg-gray-200 border-b border-gray-400">
            <div class="flex items-center gap-1">
                <button id="open-stats-btn" class="btn-xp">Stats</button>
                <button id="load-json-btn" class="btn-xp">Load...</button>
                <button id="save-json-btn" class="btn-xp">Save As...</button>
                <button id="tools-btn" class="btn-xp">Tools</button>
                <button id="help-btn" class="btn-xp w-6 h-6 p-0 font-bold">?</button>
            </div>
            <input type="file" id="json-file-input" class="hidden">
        </div>

        <main class="flex-grow flex flex-col md:flex-row gap-2 p-2 overflow-hidden">
            <div class="md:w-[350px] flex-shrink-0 flex flex-col panel-xp min-h-0">
                <div class="flex justify-between items-center mb-2"><h2 class="text-md font-bold">Businesses</h2><button id="add-new-business-btn" class="btn-xp">+ Add</button></div>
                <div class="grid grid-cols-1 gap-2 mb-2">
                    <input type="search" id="search-input" placeholder="Search by name or permit..." class="w-full input-xp">
                    <input type="search" id="tag-filter-input" placeholder="Filter by tag..." class="w-full input-xp">
                    <div class="grid grid-cols-2 gap-2">
                        <select id="sort-select" class="w-full select-xp"><option value="name-asc">Sort: Name</option><option value="date-desc">Sort: Date (Newest)</option><option value="date-asc">Sort: Date (Oldest)</option></select>
                        <select id="filter-id-select" class="w-full select-xp"><option value="all">Filter: All</option><option value="id-done">Filter: ID Done</option><option value="id-none">Filter: No ID</option><option value="flagged">Filter: Flagged</option></select>
                    </div>
                </div>
                <div id="business-list" class="space-y-1 flex-grow overflow-y-auto pr-1 panel-xp bg-white"></div>
            </div>
            <div class="flex-grow panel-xp overflow-y-auto min-h-0">
                <div id="details-view" class="h-full flex items-center justify-center text-center"><div class="text-gray-600"><p>No business selected.</p></div></div>
            </div>
        </main>
    </div>

    <!-- Modal for Add/Edit Business -->
    <div id="business-modal" class="modal-backdrop">
        <div class="window absolute">
             <div class="title-bar"><span id="modal-title-text">Add New Business</span></div>
            <div class="p-4"><form id="business-form" class="space-y-3"><input type="hidden" id="business-id">
                    <fieldset class="panel-xp"><legend>Business Info</legend>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-2">
                            <div><label for="owner-name">Owner Name</label><input type="text" id="owner-name" class="w-full input-xp" required></div>
                            <div><label for="business-name">Business Name</label><input type="text" id="business-name" class="w-full input-xp" required></div>
                            <div><label for="trade-type">Trade Type</label><input type="text" id="trade-type" class="w-full input-xp"></div>
                            <div><label for="permit-number">Permit Number</label><div class="flex"><input type="text" id="permit-number" class="w-full input-xp" required><button type="button" id="generate-permit-btn" title="Generate" class="btn-xp">[*]</button></div><p id="permit-warning" class="text-xs text-red-700 hidden">PN exists!</p></div>
                            <div class="md:col-span-2"><label for="residence">Current Residence</label><input type="text" id="residence" class="w-full input-xp"></div>
                        </div>
                    </fieldset>
                    <fieldset class="panel-xp"><legend>Identity Info</legend>
                        <div class="grid grid-cols-2 gap-4 items-end">
                            <div><label for="born-residence">Born Residence</label><input type="text" id="born-residence" class="w-full input-xp"></div>
                            <div class="flex items-center gap-1"><input id="is-outsider" type="checkbox"><label for="is-outsider">Is an Outsider</label></div>
                        </div>
                    </fieldset>
                    <fieldset class="panel-xp"><legend>ID Card Status</legend>
                        <div class="flex items-center gap-1"><input id="has-id" type="checkbox"><label for="has-id">ID Card is Done</label></div>
                        <div id="image-url-group" class="mt-2"><label for="image-url">ID Card Image URL</label><input type="url" id="image-url" class="w-full input-xp" placeholder="https://..."></div>
                    </fieldset>
                    <div class="mt-4 flex justify-end gap-2"><button type="button" id="cancel-btn" class="btn-xp">Cancel</button><button type="submit" id="save-business-btn" class="btn-xp font-bold">OK</button></div>
                </form></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- ELEMENT REFERENCES ---
            const allElements = {
                businessListEl: document.getElementById('business-list'), detailsViewEl: document.getElementById('details-view'), addNewBtn: document.getElementById('add-new-business-btn'),
                modal: document.getElementById('business-modal'), modalTitleEl: document.getElementById('modal-title-text'), cancelBtn: document.getElementById('cancel-btn'),
                businessForm: document.getElementById('business-form'), loadJsonBtn: document.getElementById('load-json-btn'), saveJsonBtn: document.getElementById('save-json-btn'),
                jsonFileInput: document.getElementById('json-file-input'), notificationArea: document.getElementById('notification-area'), hasIdCheckbox: document.getElementById('has-id'),
                isOutsiderCheckbox: document.getElementById('is-outsider'), bornResidenceInput: document.getElementById('born-residence'), imageUrlGroup: document.getElementById('image-url-group'),
                searchInput: document.getElementById('search-input'), tagFilterInput: document.getElementById('tag-filter-input'), sortSelect: document.getElementById('sort-select'),
                filterIdSelect: document.getElementById('filter-id-select'), generatePermitBtn: document.getElementById('generate-permit-btn'), permitNumberInput: document.getElementById('permit-number'),
                permitWarningEl: document.getElementById('permit-warning'), saveBusinessBtn: document.getElementById('save-business-btn'), openStatsBtn: document.getElementById('open-stats-btn'),
                closeStatsBtn: document.getElementById('close-stats-btn'), statsDrawer: document.getElementById('stats-drawer'), drawerBackdrop: document.getElementById('drawer-backdrop'),
                statsContent: document.getElementById('stats-content'), helpBtn: document.getElementById('help-btn'), helpDrawer: document.getElementById('help-drawer'),
                closeHelpBtn: document.getElementById('close-help-btn'), helpContent: document.getElementById('help-content'), contextMenu: document.getElementById('context-menu'),
                toolsBtn: document.getElementById('tools-btn'), toolsModal: document.getElementById('tools-modal'), closeToolsBtn: document.getElementById('close-tools-btn'), toolsContent: document.getElementById('tools-content'),
            };

            let businesses = [];
            let sessionData = {}; 
            let activeBusinessId = null;
            let debounceTimer;
            let imageCheckController;

            const debouncedSaveSessionData = () => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    localStorage.setItem('businessDirectorySession', JSON.stringify(sessionData));
                    showNotification("Session saved.");
                }, 1000);
            };

            function showNotification(message, isError = false) {
                const bgColor = isError ? 'bg-red-500' : 'bg-white';
                const textColor = isError ? 'text-white' : 'text-black';
                const note = document.createElement('div');
                note.className = `p-2 border border-black shadow-lg ${bgColor} ${textColor}`;
                note.textContent = message;
                allElements.notificationArea.appendChild(note);
                setTimeout(() => note.remove(), 2000);
            }

            function copyToClipboard(text) {
                if(!text) return;
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try { document.execCommand('copy'); showNotification(`Copied: "${text}"`); } 
                catch (err) { showNotification('Failed to copy text.', true); }
                document.body.removeChild(textArea);
            }
            
            function updateBornResidenceState() {
                if (!allElements.isOutsiderCheckbox.checked) {
                    allElements.bornResidenceInput.value = 'Grainmark';
                    allElements.bornResidenceInput.readOnly = true;
                    allElements.bornResidenceInput.classList.add('bg-gray-200');
                } else {
                    if (allElements.bornResidenceInput.value === 'Grainmark') allElements.bornResidenceInput.value = '';
                    allElements.bornResidenceInput.readOnly = false;
                    allElements.bornResidenceInput.classList.remove('bg-gray-200');
                    allElements.bornResidenceInput.placeholder = 'e.g., Distant Lands';
                }
            }
            
            function validatePermitNumber() {
                const permitNumber = allElements.permitNumberInput.value.trim();
                const currentId = parseInt(document.getElementById('business-id').value, 10);
                if (!permitNumber) { allElements.permitWarningEl.classList.add('hidden'); allElements.saveBusinessBtn.disabled = false; return; }
                const isDuplicate = businesses.some(b => b.permitNumber && b.permitNumber.toLowerCase() === permitNumber.toLowerCase() && b.id !== currentId);
                allElements.permitWarningEl.classList.toggle('hidden', !isDuplicate);
                allElements.saveBusinessBtn.disabled = isDuplicate;
            }
            
            function handleGeneratePermit() {
                const ownerName = document.getElementById('owner-name').value;
                const businessName = document.getElementById('business-name').value;
                const tradeType = document.getElementById('trade-type').value;
                const residence = document.getElementById('residence').value;
                const isOutsider = document.getElementById('is-outsider').checked;
                if (!ownerName || !businessName || !tradeType || !residence) { showNotification("Fill Owner, Business, Trade, & Residence fields first.", true); return; }
                const a = ownerName.charAt(0).toUpperCase();
                const digits = residence.replace(/[^0-9]/g, '');
                const num = digits.substring(0, 2).padEnd(2, '0');
                const c = businessName.charAt(0).toUpperCase();
                const d = tradeType.charAt(0).toUpperCase();
                const x = isOutsider ? 'O' : '';
                allElements.permitNumberInput.value = `${a}${num}${c}${d}${x}`;
                validatePermitNumber();
                showNotification("Permit Number Generated!");
            }

            function getFilteredAndSortedBusinesses() {
                const searchTerm = allElements.searchInput.value.toLowerCase();
                const tagTerm = allElements.tagFilterInput.value.toLowerCase();
                const sortBy = allElements.sortSelect.value;
                const filterIdBy = allElements.filterIdSelect.value; 
                
                let processedBusinesses = businesses.filter(b => 
                    (b.businessName.toLowerCase().includes(searchTerm) || b.ownerName.toLowerCase().includes(searchTerm) || (b.permitNumber && b.permitNumber.toLowerCase().includes(searchTerm))) &&
                    (!tagTerm || (sessionData[b.id]?.tags || []).some(tag => tag.toLowerCase().includes(tagTerm)))
                );
                
                if (filterIdBy === 'id-done') processedBusinesses = processedBusinesses.filter(b => b.hasId);
                else if (filterIdBy === 'id-none') processedBusinesses = processedBusinesses.filter(b => !b.hasId);
                else if (filterIdBy === 'flagged') processedBusinesses = processedBusinesses.filter(b => sessionData[b.id]?.isFlagged);

                return processedBusinesses.sort((a, b) => {
                    if (sortBy === 'name-asc') return a.businessName.localeCompare(b.businessName);
                    if (sortBy === 'date-desc') return new Date(b.dateOfIssue) - new Date(a.dateOfIssue);
                    if (sortBy === 'date-asc') return new Date(a.dateOfIssue) - new Date(b.dateOfIssue);
                    return 0;
                });
            }
            
            function getValidationIssues(business) {
                const issues = [];
                if (!business.permitNumber) issues.push("Missing Permit Number");
                if (business.hasId && !business.imageUrl) issues.push("Missing Image URL");
                if (!business.ownerName || !business.businessName) issues.push("Missing Name");
                return issues;
            }

            function renderBusinessList() {
                const processedBusinesses = getFilteredAndSortedBusinesses();
                allElements.businessListEl.innerHTML = '';
                if (processedBusinesses.length === 0) {
                     allElements.businessListEl.innerHTML = `<div class="text-center text-gray-600 p-4">No businesses match.</div>`;
                     return;
                }
                processedBusinesses.forEach(business => {
                    const isActive = business.id === activeBusinessId;
                    const itemClasses = `p-2 cursor-pointer ${isActive ? 'bg-[#0a246a] text-white' : 'hover:bg-gray-200'}`;
                    const outsiderCheck = business.isOutsider ? `<span class="${isActive ? 'text-gray-300' : 'text-gray-500'}" title="Outsider">[O]</span>` : '';
                    const idDoneCheck = business.hasId ? `<span class="text-green-700 font-bold" title="ID is done">[✓]</span>` : '';
                    const validationIssues = getValidationIssues(business);
                    const validationWarning = validationIssues.length > 0 ? `<span class="text-yellow-600 font-bold" title="${validationIssues.join(', ')}">[!]</span>` : '';
                    const flagCheck = sessionData[business.id]?.isFlagged ? `<span class="text-red-600 font-bold" title="Flagged for Review">[⚑]</span>` : '';
                    const tags = sessionData[business.id]?.tags || [];
                    const tagsHTML = tags.length > 0 ? `<div class="flex flex-wrap gap-1 mt-1">${tags.map(tag => `<span class="text-xs bg-gray-300 px-1">${tag}</span>`).join('')}</div>` : '';

                    const item = document.createElement('div');
                    item.className = itemClasses;
                    item.dataset.id = business.id;
                    item.innerHTML = `<div class="flex justify-between items-center"><h3 class="font-bold truncate">${business.businessName}</h3><div class="flex gap-1 items-center text-xs">${flagCheck} ${validationWarning} ${outsiderCheck} ${idDoneCheck}</div></div><p class="text-xs ${isActive ? 'text-gray-300' : 'text-gray-600'}">Owner: ${business.ownerName}</p>${tagsHTML}`;
                    item.addEventListener('contextmenu', showContextMenu);
                    item.addEventListener('click', () => { activeBusinessId = business.id; renderAll(); });
                    allElements.businessListEl.appendChild(item);
                });
            }
            
            function updateStatistics() {
                const total = businesses.length;
                if (total === 0) { allElements.statsContent.innerHTML = `<p class="text-gray-600 text-center">No data loaded.</p>`; return; }
                const idsDone = businesses.filter(b => b.hasId).length;
                const idPercentage = total > 0 ? Math.round((idsDone / total) * 100) : 0;
                const locals = businesses.filter(b => !b.isOutsider).length;
                const outsiders = total - locals;
                const tradeCounts = businesses.reduce((acc, b) => { if(b.tradeType) { acc[b.tradeType] = (acc[b.tradeType] || 0) + 1; } return acc; }, {});
                const topTrades = Object.entries(tradeCounts).sort((a,b) => b[1] - a[1]).slice(0, 3);
                allElements.statsContent.innerHTML = `<div><strong>Total Businesses:</strong> ${total}</div><div><strong>IDs Complete:</strong> ${idsDone} / ${total} (${idPercentage}%)</div><div class="w-full bg-gray-400 border border-black h-4"><div class="bg-blue-500 h-full" style="width: ${idPercentage}%"></div></div><div><strong>Locals / Outsiders:</strong> ${locals} / ${outsiders}</div><div class="pt-2 border-t border-gray-400 mt-2"><h4 class="font-bold mb-1">Top Trade Types</h4>${topTrades.length > 0 ? topTrades.map(([type, count]) => `<div>${type}: <strong>${count}</strong></div>`).join('') : '<p>No trades specified.</p>'}</div>`;
            }

            function displayBusinessDetails(id) {
                const business = businesses.find(b => b.id === id);
                if (!business) { resetDetailsView(); return; }

                let imageDisplay = '';
                if (business.hasId && business.imageUrl) {
                    imageDisplay = `<div class="mb-4"><img src="${business.imageUrl}" alt="ID Card" class="w-full h-auto object-contain max-h-64 border-2 border-inset border-gray-500" onerror="this.onerror=null;this.src='https://placehold.co/800x400/d4d0c8/000000?text=Image+Not+Found';"></div>`;
                }
                
                const qrText = `Owner: ${business.ownerName}\nBusiness: ${business.businessName}\nPermit: ${business.permitNumber}`;
                const qr = qrcode(0, 'L');
                qr.addData(qrText);
                qr.make();
                const qrCodeImage = qr.createImgTag(4, 4);

                const createFieldHTML = (label, value) => `<div class="p-2 flex justify-between items-center bg-white panel-xp"><div><strong>${label}:</strong> <span>${value || 'N/A'}</span></div><button class="copy-btn btn-xp px-2 py-0" data-copy-text="${value || ''}" title="Copy">[C]</button></div>`;
                const tags = sessionData[id]?.tags || [];
                const tagsHTML = tags.map(tag => `<span class="bg-blue-200 text-blue-800 text-xs font-semibold mr-2 px-2.5 py-0.5 rounded flex items-center">${tag} <button class="remove-tag-btn ml-2 text-red-700 font-bold" data-tag="${tag}">x</button></span>`).join('');

                allElements.detailsViewEl.innerHTML = `<div class="flex flex-col h-full text-left">
                    <div class="flex-grow"><div class="flex items-center justify-between mb-2"><h2 class="text-xl font-bold">${business.businessName}</h2><button id="flag-business-btn" class="btn-xp p-1" title="Flag for Review">${sessionData[id]?.isFlagged ? 'Unflag ⚑' : 'Flag ⚑'}</button></div><p class="mb-2">Operated by ${business.ownerName}</p>${imageDisplay}
                        <div class="space-y-1">${createFieldHTML('Trade Type', business.tradeType)} ${createFieldHTML('Permit Number', business.permitNumber)} ${createFieldHTML('Current Residence', business.residence)}
                            ${createFieldHTML('Born Residence', business.bornResidence)} ${createFieldHTML('Date of Issue', business.dateOfIssue)} ${createFieldHTML('Is Outsider', business.isOutsider ? 'Yes' : 'No')}
                        </div></div>
                    <div class="mt-2 pt-2 border-t-2 border-gray-400"><h3 class="font-bold mb-1">Tags</h3><div class="flex flex-wrap items-center gap-2" id="tags-container">${tagsHTML}</div><input type="text" id="add-tag-input" class="input-xp w-full mt-2" placeholder="Add a tag and press Enter..."></div>
                    <div class="mt-2 pt-2 border-t-2 border-gray-400"><h3 class="font-bold mb-1">Session Notes</h3><textarea id="session-note-textarea" class="w-full input-xp h-20" placeholder="Temp notes..."></textarea></div>
                    <div class="mt-2 pt-2 border-t-2 border-gray-400 text-center"><h3 class="font-bold mb-2">Business QR Code</h3><div id="qrcode-container">${qrCodeImage}</div></div>
                    <div class="mt-auto pt-2 flex justify-end gap-2"><button data-id="${id}" class="edit-btn btn-xp">Edit</button><button data-id="${id}" class="delete-btn btn-xp">Delete</button></div>
                </div>`;
                
                const noteTextarea = allElements.detailsViewEl.querySelector('#session-note-textarea');
                noteTextarea.value = sessionData[id]?.notes || '';
                noteTextarea.addEventListener('input', (e) => { if (!sessionData[id]) sessionData[id] = {}; sessionData[id].notes = e.target.value; debouncedSaveSessionData(); });
                const addTagInput = allElements.detailsViewEl.querySelector('#add-tag-input');
                addTagInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && addTagInput.value.trim() !== '') {
                        e.preventDefault(); if (!sessionData[id]) sessionData[id] = { tags: [] }; if (!sessionData[id].tags) sessionData[id].tags = [];
                        const newTag = addTagInput.value.trim(); if (!sessionData[id].tags.includes(newTag)) { sessionData[id].tags.push(newTag); debouncedSaveSessionData(); renderAll(); }
                        addTagInput.value = '';
                    }
                });
                allElements.detailsViewEl.querySelectorAll('.remove-tag-btn').forEach(btn => btn.addEventListener('click', (e) => {
                    const tagToRemove = e.currentTarget.dataset.tag; if(sessionData[id]?.tags) { sessionData[id].tags = sessionData[id].tags.filter(t => t !== tagToRemove); debouncedSaveSessionData(); renderAll(); }
                }));
                allElements.detailsViewEl.querySelectorAll('.copy-btn').forEach(btn => btn.addEventListener('click', (e) => { copyToClipboard(e.currentTarget.dataset.copyText); }));
                allElements.detailsViewEl.querySelector('.edit-btn').addEventListener('click', () => openModal(business));
                allElements.detailsViewEl.querySelector('.delete-btn').addEventListener('click', () => deleteBusiness(business.id));
                allElements.detailsViewEl.querySelector('#flag-business-btn').addEventListener('click', () => {
                    if (!sessionData[id]) sessionData[id] = {};
                    sessionData[id].isFlagged = !sessionData[id].isFlagged;
                    debouncedSaveSessionData();
                    renderAll();
                });
            }
            
            function resetDetailsView() { allElements.detailsViewEl.innerHTML = `<div class="text-gray-600"><p>No business selected.</p></div>`; }

            function openModal(business = null) {
                allElements.businessForm.reset(); allElements.imageUrlGroup.style.display = 'none'; allElements.saveBusinessBtn.disabled = false; allElements.permitWarningEl.classList.add('hidden');
                if (business) {
                    allElements.modalTitleEl.textContent = 'Edit Business'; document.getElementById('business-id').value = business.id; document.getElementById('owner-name').value = business.ownerName; document.getElementById('business-name').value = business.businessName;
                    document.getElementById('trade-type').value = business.tradeType; allElements.permitNumberInput.value = business.permitNumber; document.getElementById('residence').value = business.residence;
                    allElements.bornResidenceInput.value = business.bornResidence || ''; allElements.isOutsiderCheckbox.checked = business.isOutsider || false; allElements.hasIdCheckbox.checked = business.hasId || false;
                    document.getElementById('image-url').value = business.imageUrl || '';
                } else {
                    allElements.modalTitleEl.textContent = 'Add New Business'; document.getElementById('business-id').value = ''; allElements.isOutsiderCheckbox.checked = false; 
                }
                allElements.hasIdCheckbox.dispatchEvent(new Event('change')); updateBornResidenceState();
                allElements.modal.style.display = 'flex'; allElements.modal.classList.add('items-center', 'justify-center');
            }

            function closeModal() { allElements.modal.style.display = 'none'; }
            function openDrawer(drawer) { drawer.classList.add('open'); allElements.drawerBackdrop.style.display = 'block'; }
            function closeDrawer(drawer) { drawer.classList.remove('open'); allElements.drawerBackdrop.style.display = 'none'; }
            function openToolsModal() { allElements.toolsModal.style.display = 'flex'; allElements.toolsModal.classList.add('items-center', 'justify-center'); populateTools(); }
            function closeToolsModal() { allElements.toolsModal.style.display = 'none'; }

            function handleFormSubmit(e) {
                e.preventDefault();
                const idFromForm = document.getElementById('business-id').value;
                const businessData = {
                    ownerName: document.getElementById('owner-name').value, businessName: document.getElementById('business-name').value, tradeType: document.getElementById('trade-type').value, permitNumber: allElements.permitNumberInput.value,
                    residence: document.getElementById('residence').value, bornResidence: allElements.bornResidenceInput.value, isOutsider: allElements.isOutsiderCheckbox.checked, hasId: allElements.hasIdCheckbox.checked, imageUrl: document.getElementById('image-url').value,
                };
                if (idFromForm) {
                    const numericId = parseInt(idFromForm, 10);
                    const index = businesses.findIndex(b => b.id === numericId);
                    if (index > -1) { businesses[index] = { ...businesses[index], ...businessData }; activeBusinessId = numericId; } 
                    else { showNotification("Error: Could not save. Business not found.", true); closeModal(); return; }
                } else {
                    businessData.id = Date.now(); businessData.dateOfIssue = new Date().toISOString().split('T')[0];
                    businesses.push(businessData); activeBusinessId = businessData.id;
                }
                renderAll(); closeModal(); showNotification(`Business "${businessData.businessName}" saved!`);
            }
            
            function deleteBusiness(id) {
                 if (confirm('Are you sure you want to delete this business?')) {
                    businesses = businesses.filter(b => b.id !== id);
                    if (activeBusinessId === id) { activeBusinessId = null; delete sessionData[id]; debouncedSaveSessionData(); }
                    renderAll(); showNotification('Business deleted.');
                }
            }
            
            function renderAll() {
                 renderBusinessList(); updateStatistics();
                 if (activeBusinessId) {
                    const businessExists = businesses.some(b => b.id === activeBusinessId);
                    if (businessExists) { displayBusinessDetails(activeBusinessId); } else { activeBusinessId = null; resetDetailsView(); }
                 } else { resetDetailsView(); }
            }
            
            function loadData(data, isNewFile) {
                if (!Array.isArray(data)) throw new Error('JSON is not an array.');
                businesses = data; 
                if(isNewFile) { sessionData = {}; localStorage.removeItem('businessDirectorySession'); }
                activeBusinessId = null; 
                renderAll();
            }

            function handleFileLoad(event) {
                const file = event.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        loadData(data, true); showNotification('Data loaded from file!', false);
                    } catch (err) { showNotification(`Error loading file: ${err.message}`, true); }
                };
                reader.readAsText(file); allElements.jsonFileInput.value = '';
            }

            async function loadDefaultData() {
                try {
                    const savedSession = localStorage.getItem('businessDirectorySession');
                    if (savedSession) { sessionData = JSON.parse(savedSession); }
                    const response = await fetch('businesses.json');
                    if (response.ok) { const data = await response.json(); loadData(data, false); showNotification('Default directory loaded!'); } 
                    else { showNotification('Default directory not found.', true); renderAll(); }
                } catch (error) { showNotification('Could not fetch default directory.', true); renderAll(); }
            }

            function handleFileSave() {
                if (businesses.length === 0) { showNotification('No data to save.', true); return; }
                const dataStr = JSON.stringify(businesses, null, 2);
                const blob = new Blob([dataStr], {type: "application/json"});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = 'businesses.json'; a.click();
                URL.revokeObjectURL(url);
                showNotification('Data saved to businesses.json!');
            }
            
            function populateHelpDrawer() {
                const shortcuts = [ { key: 'Ctrl + S', desc: 'Save data to businesses.json' }, { key: 'Ctrl + O', desc: 'Open file dialog' }, { key: 'N', desc: 'Add New Business' }, { key: 'Esc', desc: 'Close window/drawer' }, { key: '?', desc: 'Toggle this help' } ];
                allElements.helpContent.innerHTML = shortcuts.map(sc => `<div><strong>${sc.key}</strong>: ${sc.desc}</div>`).join('');
            }
            
            function showContextMenu(e) {
                e.preventDefault();
                hideContextMenu();
                const targetItem = e.currentTarget;
                const id = parseInt(targetItem.dataset.id, 10);
                allElements.contextMenu.style.display = 'block';
                allElements.contextMenu.style.left = `${e.clientX}px`;
                allElements.contextMenu.style.top = `${e.clientY}px`;
                allElements.contextMenu.dataset.id = id;
            }
            
            function hideContextMenu() { allElements.contextMenu.style.display = 'none'; }
            
            // --- TOOLS ---
            function populateTools() {
                allElements.toolsContent.innerHTML = `
                    <fieldset class="panel-xp"><legend>Find Duplicates</legend><p class="mb-2">Find businesses with the same Permit Number.</p><button id="find-duplicates-btn" class="btn-xp">Run</button><div id="duplicates-results" class="mt-2 bg-white panel-xp max-h-24 overflow-y-auto"></div></fieldset>
                    <fieldset class="panel-xp"><legend>Image Link Checker</legend><p class="mb-2">Check businesses with an ID for broken image links.</p><div class="flex gap-2"><button id="check-images-btn" class="btn-xp">Run</button><button id="stop-check-images-btn" class="btn-xp hidden">Stop</button></div><div id="image-check-results" class="mt-2 bg-white panel-xp max-h-24 overflow-y-auto"></div></fieldset>
                    <fieldset class="panel-xp"><legend>Smart Image Relinker</legend><p class="mb-2">Fix links by generating new ones from Permit Numbers.</p>
                        <div><label>New GitHub Base URL:</label><input type="text" id="new-base-url" class="input-xp w-full" placeholder="https://raw.githubusercontent.com/user/repo/main/images/"></div>
                        <div class="flex gap-2 mt-2"><button id="relink-preview-btn" class="btn-xp">Preview</button><button id="relink-confirm-btn" class="btn-xp hidden">Confirm & Relink All</button></div>
                        <div id="relink-results" class="mt-2 bg-white panel-xp max-h-24 overflow-y-auto"></div></fieldset>
                `;
                allElements.toolsContent.querySelector('#find-duplicates-btn').addEventListener('click', findDuplicates);
                allElements.toolsContent.querySelector('#check-images-btn').addEventListener('click', checkImageLinks);
                allElements.toolsContent.querySelector('#stop-check-images-btn').addEventListener('click', stopImageCheck);
                allElements.toolsContent.querySelector('#relink-preview-btn').addEventListener('click', previewSmartRelink);
                allElements.toolsContent.querySelector('#relink-confirm-btn').addEventListener('click', confirmSmartRelink);
            }
            
            function findDuplicates() {
                const resultsEl = allElements.toolsContent.querySelector('#duplicates-results');
                const permitGroups = businesses.reduce((acc, b) => { if (b.permitNumber) { const pn = b.permitNumber.toLowerCase(); if (!acc[pn]) acc[pn] = []; acc[pn].push(b); } return acc; }, {});
                const duplicates = Object.values(permitGroups).filter(group => group.length > 1);
                if (duplicates.length === 0) { resultsEl.innerHTML = 'No duplicates found.'; return; }
                resultsEl.innerHTML = duplicates.map(group => `<div><strong>PN: ${group[0].permitNumber}</strong> is used by:</div><ul class="list-disc pl-5 mb-2">${group.map(b => `<li><button class="text-blue-600 hover:underline" data-id="${b.id}">${b.businessName} (Owner: ${b.ownerName})</button></li>`).join('')}</ul>`).join('');
                resultsEl.querySelectorAll('button').forEach(btn => btn.addEventListener('click', (e) => { activeBusinessId = parseInt(e.currentTarget.dataset.id, 10); renderAll(); closeToolsModal(); }));
            }
            
            async function checkImageLinks() {
                const resultsEl = allElements.toolsContent.querySelector('#image-check-results');
                const checkBtn = allElements.toolsContent.querySelector('#check-images-btn');
                const stopBtn = allElements.toolsContent.querySelector('#stop-check-images-btn');
                checkBtn.classList.add('hidden'); stopBtn.classList.remove('hidden');
                imageCheckController = new AbortController();
                resultsEl.innerHTML = 'Checking...';
                const businessesToCheck = businesses.filter(b => b.hasId && b.imageUrl);
                const brokenLinks = [];
                for (const business of businessesToCheck) {
                    if (imageCheckController.signal.aborted) { resultsEl.innerHTML = 'Check stopped.'; break; }
                    resultsEl.innerHTML = `Checking: ${business.businessName}`;
                    try { await fetch(business.imageUrl, { mode: 'no-cors', signal: imageCheckController.signal }); } catch (e) { if (e.name !== 'AbortError') { brokenLinks.push(business); } }
                }
                if (imageCheckController.signal.aborted) return;
                if (brokenLinks.length === 0) { resultsEl.innerHTML = 'No broken image links found.'; } 
                else {
                    resultsEl.innerHTML = brokenLinks.map(b => `<div><button class="text-blue-600 hover:underline" data-id="${b.id}">${b.businessName}</button> has a broken link.</div>`).join('');
                    resultsEl.querySelectorAll('button').forEach(btn => btn.addEventListener('click', (e) => { activeBusinessId = parseInt(e.currentTarget.dataset.id, 10); renderAll(); closeToolsModal(); }));
                }
                checkBtn.classList.remove('hidden'); stopBtn.classList.add('hidden');
            }
            
            function stopImageCheck() { if (imageCheckController) { imageCheckController.abort(); } }

            function previewSmartRelink() {
                const newBase = document.getElementById('new-base-url').value;
                const resultsEl = document.getElementById('relink-results');
                const confirmBtn = document.getElementById('relink-confirm-btn');
                if(!newBase) { resultsEl.innerHTML = 'Please provide the New GitHub Base URL.'; confirmBtn.classList.add('hidden'); return; }
                const affected = businesses.filter(b => b.hasId && b.permitNumber);
                if(affected.length === 0) { resultsEl.innerHTML = 'No businesses with IDs and Permit Numbers found to relink.'; confirmBtn.classList.add('hidden'); return; }
                resultsEl.innerHTML = `<strong>${affected.length} businesses will be updated:</strong><ul class="list-disc pl-5">${affected.map(b => `<li>${b.businessName} → .../${b.permitNumber}.png</li>`).join('')}</ul>`;
                confirmBtn.classList.remove('hidden');
            }

            function confirmSmartRelink() {
                const newBase = document.getElementById('new-base-url').value;
                if(!newBase) { showNotification("Missing New GitHub Base URL.", true); return; }
                let count = 0;
                businesses.forEach(b => {
                    if(b.hasId && b.permitNumber) {
                        b.imageUrl = `${newBase}${b.permitNumber}.png`;
                        count++;
                    }
                });
                renderAll();
                showNotification(`${count} image links updated successfully!`);
                closeToolsModal();
            }

            // --- EVENT LISTENERS ---
            allElements.addNewBtn.addEventListener('click', () => openModal());
            allElements.cancelBtn.addEventListener('click', closeModal);
            allElements.businessForm.addEventListener('submit', handleFormSubmit);
            allElements.generatePermitBtn.addEventListener('click', handleGeneratePermit);
            allElements.permitNumberInput.addEventListener('input', validatePermitNumber);
            allElements.loadJsonBtn.addEventListener('click', () => allElements.jsonFileInput.click());
            allElements.jsonFileInput.addEventListener('change', handleFileLoad);
            allElements.saveJsonBtn.addEventListener('click', handleFileSave);
            allElements.hasIdCheckbox.addEventListener('change', (e) => { allElements.imageUrlGroup.style.display = e.target.checked ? 'block' : 'none'; });
            allElements.isOutsiderCheckbox.addEventListener('change', updateBornResidenceState);
            allElements.searchInput.addEventListener('input', renderBusinessList);
            allElements.tagFilterInput.addEventListener('input', renderBusinessList);
            allElements.sortSelect.addEventListener('change', renderBusinessList);
            allElements.filterIdSelect.addEventListener('change', renderBusinessList); 
            allElements.openStatsBtn.addEventListener('click', () => openDrawer(allElements.statsDrawer));
            allElements.closeStatsBtn.addEventListener('click', () => closeDrawer(allElements.statsDrawer));
            allElements.helpBtn.addEventListener('click', () => openDrawer(allElements.helpDrawer));
            allElements.closeHelpBtn.addEventListener('click', () => closeDrawer(allElements.helpDrawer));
            allElements.toolsBtn.addEventListener('click', openToolsModal);
            allElements.closeToolsBtn.addEventListener('click', closeToolsModal);
            allElements.drawerBackdrop.addEventListener('click', () => { closeDrawer(allElements.statsDrawer); closeDrawer(allElements.helpDrawer); });
            
            allElements.contextMenu.addEventListener('click', (e) => {
                const action = e.target.id;
                const id = parseInt(allElements.contextMenu.dataset.id, 10);
                const business = businesses.find(b => b.id === id);
                if(!business) return;

                if (action === 'context-edit') openModal(business);
                if (action === 'context-delete') deleteBusiness(id);
                if (action === 'context-copy-pn') copyToClipboard(business.permitNumber);
                if (action === 'context-flag') {
                    if (!sessionData[id]) sessionData[id] = {};
                    sessionData[id].isFlagged = !sessionData[id].isFlagged;
                    debouncedSaveSessionData();
                    renderAll();
                }
                if (action === 'context-relink') {
                    const newBase = prompt("Enter your new GitHub base URL (e.g., https://raw.githubusercontent.com/user/repo/main/images/):");
                    if (newBase && business.permitNumber) {
                        business.imageUrl = `${newBase}${business.permitNumber}.png`;
                        renderAll();
                        showNotification('Image link updated!');
                    } else if (!business.permitNumber) {
                        showNotification('Business must have a permit number to generate a link.', true);
                    }
                }

                hideContextMenu();
            });
            
            window.addEventListener('click', (e) => { if(!allElements.contextMenu.contains(e.target)) { hideContextMenu(); }});
            
            document.addEventListener('keydown', (e) => {
                const activeEl = document.activeElement;
                const isTyping = ['INPUT', 'TEXTAREA'].includes(activeEl.tagName);

                if (e.key === 'Escape') {
                    closeModal(); closeToolsModal();
                    closeDrawer(allElements.statsDrawer); closeDrawer(allElements.helpDrawer);
                }
                if(isTyping) return;

                if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); handleFileSave(); }
                if ((e.ctrlKey || e.metaKey) && e.key === 'o') { e.preventDefault(); allElements.loadJsonBtn.click(); }
                if (e.key.toLowerCase() === 'n') { e.preventDefault(); openModal(); }
                if (e.key === '?') { e.preventDefault(); openDrawer(allElements.helpDrawer); }
            });

            // --- INITIALIZATION ---
            populateHelpDrawer();
            loadDefaultData();
        });
    </script>
</body>
</html>
